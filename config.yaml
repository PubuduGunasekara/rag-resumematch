# Non-secret config. Anything that differs per machine/person (model
# names you might swap, paths) belongs here, not hardcoded in modules.

chroma_persist_dir: ./chroma_db

chunking:
  chunk_size: 300        # tokens, roughly
  chunk_overlap: 50

retrieval:
  top_k: 5               # distinct POSTINGS sent to the LLM (not chunks)
  per_section_k: 30      # chunks retrieved per resume section before fusion
  max_per_company: 2     # near-duplicate postings from one employer fill slots otherwise

query_correction:
  # Guard rails for running an edit-distance corrector on resume text; see
  # query_correction.correct_query for the false positive behind each.
  min_token_length: 4     # never correct shorter unknown words (Lua, ESP)
  edit2_min_length: 8     # edit-distance-2 fixes only on long words

generation:
  temperature: 0.2        # low temperature: this is an analytical task,
                          # not creative generation
  max_tokens: 1024        # output cap; the JSON schema allows at most 8+8 short items
  num_ctx: 8192           # explicit: Ollama's default 4,096 was 96% full on a
                          # real prompt, and overflow drops prompt text silently

# Results page (one pooled call; see docs/engineering-log.md, entry coverage-ab):
# 12 items per list plus "include requirements from every excerpt" doubled
# per-job coverage on 2 of 3 resumes for ~5 s more.
report:
  max_items: 12
  cover_each: true
  max_tokens: 1536
