# Local profile: CPU only, small model. Run from the repo root:
#   docker compose -f docker-compose.local.yml up --build
# then open http://localhost:8501
#
# On a Mac, Docker can't use the Metal GPU, so Ollama here runs on CPU --
# a realistic stand-in for a CPU-only portfolio host. For speed while
# developing, point the app at Ollama running natively on the host instead:
#   OLLAMA_HOST_FOR_APP=http://host.docker.internal:11434 docker compose -f docker-compose.local.yml up

services:
  ollama:
    image: ollama/ollama:0.40.15   # pinned: the version all measurements used (JSON-schema output)
    volumes:
      - ollama_models:/root/.ollama
    # No published port: the app reaches it as http://ollama:11434 on the
    # compose network, and 11434 on the host is often taken by a native
    # Ollama install.

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST_FOR_APP:-http://ollama:11434}
      - OLLAMA_MODEL=llama3.2:3b
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - KAGGLEHUB_CACHE=/app/data/raw/kagglehub
      # read from .env in the repo root (never baked into the image)
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - BUILD_INDEX_ARGS=${BUILD_INDEX_ARGS:-}   # e.g. "--limit 2000" for a quick first run
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw

volumes:
  ollama_models:
