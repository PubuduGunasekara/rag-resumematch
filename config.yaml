# Non-secret config. Anything that differs per machine/person (model
# names you might swap, paths) belongs here, not hardcoded in modules.

chroma_persist_dir: ./chroma_db

chunking:
  chunk_size: 300        # tokens, roughly
  chunk_overlap: 50

retrieval:
  top_k: 5               # distinct POSTINGS sent to the LLM (not chunks)
  per_section_k: 30      # chunks retrieved per resume section before fusion

query_correction:
  # Guard rails for running Assignment 3's corrector on resume text; see
  # query_correction.correct_query for the false positive behind each.
  min_token_length: 4     # never correct shorter unknown words (Lua, ESP)
  edit2_min_length: 8     # edit-distance-2 fixes only on long words

generation:
  temperature: 0.2        # low temperature: this is an analytical task,
                          # not creative generation
  max_tokens: 800
