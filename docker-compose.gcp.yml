# GCP deployment profile: GPU passthrough, full-size model, full dataset.
# Run on the GCP VM (after nvidia-container-toolkit is installed — see
# gcp/start.sh, which checks for it): docker-compose -f docker-compose.gcp.yml up --build -d

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b   # GPU has headroom for the bigger model
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    volumes:
      - chroma_data:/data/chroma_db
      - ./data/raw:/app/data/raw
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
