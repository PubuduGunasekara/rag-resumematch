# Local dev profile: CPU only, small quantized model, your laptop.
# Run: docker-compose -f docker-compose.local.yml up --build

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # no `deploy.resources.reservations.devices` block here — CPU only

  app:
    build: .
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b   # small model: CPU inference needs to stay usable
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    volumes:
      - chroma_data:/data/chroma_db
      - ./data/raw:/app/data/raw

volumes:
  ollama_data:
  chroma_data:
