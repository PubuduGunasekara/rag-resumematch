[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resumematch"
version = "0.1.0"
description = "Compares a resume with 107,528 job postings using retrieval and a local LLM, and checks every claim in code"
requires-python = ">=3.11,<3.13"  # tested on 3.11 (Docker, CI) and 3.12; 3.15 failed to create a venv
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pubudu Gunasekara" }]
keywords = ["rag", "retrieval", "nlp", "llm", "ollama", "resume", "job-postings"]

[project.urls]
Repository = "https://github.com/PubuduGunasekara/rag-resumematch"
Design = "https://github.com/PubuduGunasekara/rag-resumematch/blob/main/docs/design.md"
"Engineering log" = "https://github.com/PubuduGunasekara/rag-resumematch/blob/main/docs/engineering-log.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# E501: long lines are not enforced (no auto-formatter in this repo).
# B008: FastAPI's File(...)/Form(...) defaults are the framework's idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
